name: Deploy to GitHub Pages

on:
  push:
    branches: 'master'

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Optimize Database for Build
        run: |
          sqlite3 dhamma.db "PRAGMA journal_mode = WAL;" || true
          sqlite3 dhamma.db "PRAGMA synchronous = NORMAL;" || true
          sqlite3 dhamma.db "PRAGMA optimize;" || true
          echo "✅ Database optimized for concurrent reads"

      - name: Build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
